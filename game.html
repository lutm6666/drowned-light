<title>溺光</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one centred column. Masthead, then the game stage with its overlays, then a controls strip.
   One committed dark look: the page is the inside of a lighthouse at night. */
:root{
  color-scheme:dark;
  --abyss:#060d0d; --deep:#0d1a1a; --kelp:#1b3633; --fog:#93aaa3; --bone:#e6e1cf;
  --lantern:#eaa53a; --blood:#c0473c; --eldritch:#9163d6; --tide:#3fb7a6;
  --f-display:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
[hidden]{display:none!important}
html,body{background:var(--abyss);color:var(--bone)}
body{font-family:var(--f-body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6vw,46px);letter-spacing:.18em;margin:0;color:var(--lantern);text-shadow:0 0 28px rgba(234,165,58,.35)}
header p{margin:0;color:var(--fog);font-size:13px;letter-spacing:.08em}

.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px 14px;align-items:center;font-size:12px;color:var(--fog)}
.bar{display:flex;flex-direction:column;gap:3px;min-width:0}
.bar span{letter-spacing:.12em;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.track{height:9px;background:var(--deep);border:1px solid var(--kelp);position:relative;overflow:hidden}
.fill{position:absolute;inset:0;transform-origin:left;transition:transform .12s linear}
#fHp{background:var(--blood)} #fSt{background:var(--tide)} #fSa{background:var(--eldritch)}
.stat{display:flex;gap:14px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--bone)}
.stat b{color:var(--lantern);font-weight:700}
@media (max-width:620px){.hud{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{grid-column:1/-1}}

.stage{position:relative;border:1px solid var(--kelp);background:#000;aspect-ratio:16/10;width:min(100%,max(280px,calc((100dvh - 210px)*1.6)));margin-inline:auto;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#floorName{position:absolute;left:12px;top:8px;font-family:var(--f-display);font-size:14px;letter-spacing:.2em;color:var(--fog);pointer-events:none}
#prompt{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);background:rgba(6,13,13,.85);border:1px solid var(--lantern);color:var(--bone);padding:4px 14px;font-size:13px;letter-spacing:.08em;pointer-events:none;white-space:nowrap}
#toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-family:var(--f-display);font-size:clamp(14px,2.6vw,20px);letter-spacing:.2em;color:var(--bone);text-shadow:0 0 12px #000,0 0 4px #000;pointer-events:none;text-align:center;opacity:0;transition:opacity .4s}
#toast.on{opacity:1}

.ov{position:absolute;inset:0;background:rgba(4,9,9,.93);display:flex;overflow-y:auto;padding:clamp(12px,3vw,28px)}
.panel{margin:auto;width:min(680px,100%);display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,4.4vw,32px);letter-spacing:.2em;margin:0;color:var(--lantern);text-wrap:balance}
.panel h3{font-family:var(--f-display);font-size:14px;letter-spacing:.2em;color:var(--fog);margin:6px 0 0;font-weight:500;border-bottom:1px solid var(--kelp);padding-bottom:4px}
.panel p{margin:0;color:var(--bone);max-width:34em}
.panel p.dim{color:var(--fog);font-size:13px}
.panel p.page{font-family:var(--f-display);line-height:2;white-space:pre-line;border-left:2px solid var(--eldritch);padding-left:14px}
.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
button{font:inherit;color:var(--bone);background:var(--deep);border:1px solid var(--kelp);padding:8px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
button small{color:var(--fog);font-size:12px;line-height:1.5}
button b{font-weight:700;letter-spacing:.06em}
button:hover:not(:disabled),button:focus-visible{border-color:var(--lantern);outline:none;background:var(--kelp)}
button:disabled{opacity:.42;cursor:default}
button.go{background:var(--lantern);color:#1a1204;border-color:var(--lantern);font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:.3em;text-align:center;align-items:center;padding:12px}
button.go:hover,button.go:focus-visible{background:#ffc25e}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{flex-direction:row;padding:4px 10px;font-size:13px}

.pad{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,54px);gap:8px}
.pad button{width:54px;height:54px;border-radius:50%;align-items:center;justify-content:center;text-align:center;background:rgba(13,26,26,.7);font-size:14px;padding:0}
.pad button:active{background:var(--kelp);border-color:var(--lantern)}
#stick{position:absolute;width:96px;height:96px;border-radius:50%;border:1px solid var(--fog);opacity:.5;pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px;border-radius:50%;background:var(--fog)}

.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 18px;font-size:13px;color:var(--fog);margin:0;padding:0;list-style:none}
.keys kbd{font-family:inherit;color:var(--bone);border:1px solid var(--kelp);padding:0 6px;margin-right:6px;background:var(--deep)}
@media (prefers-reduced-motion:reduce){.fill,#toast{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>溺光</h1>
    <p>霧港燈塔的光熄了。提著最後一盞燈，往下走。</p>
  </header>

  <div class="hud" aria-live="off">
    <div class="bar"><span>生命 <i id="tHp">100</i></span><div class="track"><div class="fill" id="fHp"></div></div></div>
    <div class="bar"><span>體力 <i id="tSt">100</i></span><div class="track"><div class="fill" id="fSt"></div></div></div>
    <div class="bar"><span>理智 <i id="tSa">100</i></span><div class="track"><div class="fill" id="fSa"></div></div></div>
    <div class="stat"><span>燈油 <b id="tFl">2</b></span><span>迴響 <b id="tEc">0</b></span></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv" width="960" height="600"></canvas>
    <div id="floorName"></div>
    <div id="toast"></div>
    <div id="prompt" hidden></div>
    <div id="stick" hidden><i></i></div>
    <div class="pad" id="pad" hidden>
      <button type="button" data-k="heal">燈油</button><button type="button" data-k="use">調查</button><button type="button" data-k="heavy">重擊</button>
      <span></span><button type="button" data-k="roll">翻滾</button><button type="button" data-k="light">攻擊</button>
    </div>
    <div class="ov" id="ov"></div>
  </div>

  <ul class="keys">
    <li><kbd>W A S D</kbd>移動</li>
    <li><kbd>滑鼠左鍵</kbd>/<kbd>J</kbd>輕攻擊</li>
    <li><kbd>滑鼠右鍵</kbd>/<kbd>K</kbd>重攻擊</li>
    <li><kbd>空白鍵</kbd>翻滾，有無敵時間</li>
    <li><kbd>Q</kbd>喝燈油回血</li>
    <li><kbd>E</kbd>調查</li>
  </ul>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cv'), g = cv.getContext('2d');
const W = 960, H = 600, T = 32, MW = 56, MH = 42;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return Math.abs(d); };

/* ---------- 存檔：只存跨輪次的進度 ---------- */
const SAVE = 'drowned-light.v1';
const blankMeta = () => ({ echoes: 0, up: { vit: 0, end: 0, flask: 0, blade: 0, will: 0 }, pages: 0, remnant: null, runs: 0, wins: 0, deepest: 0 });
function loadMeta() { try { const s = JSON.parse(localStorage.getItem(SAVE)); if (s && s.up) return Object.assign(blankMeta(), s); } catch (e) {} return blankMeta(); }
function saveMeta() { try { localStorage.setItem(SAVE, JSON.stringify(meta)); } catch (e) {} }
let meta = loadMeta();

/* ---------- 文本 ---------- */
const FLOORS = ['霧港街巷', '淹沒的禮拜堂', '燈塔地窖', '潮母之淵'];
const PAGES = [
  '守燈日誌・其一\n\n霧又上來了。今晚點燈時，海面下有東西跟著光轉。\n我告訴自己那是魚群。魚群不會停在同一個地方，整夜抬頭看。',
  '守燈日誌・其二\n\n鎮上的人開始往海裡走。他們說聽見有人叫自己的名字。\n神父把禮拜堂的長椅拆了，在地上刻記號。他說這些記號清醒的人看不見，這樣才安全。',
  '守燈日誌・其三\n\n我下到地窖，想找前任守燈人留下的東西。\n牆上有他的字：「光不是用來照船的。」\n後面的字被水泡爛了，只剩一句：「牠靠光認路。」',
  '守燈日誌・其四\n\n我試著三天不點燈。第三天夜裡，燈自己亮了。\n點燈的人提著一盞和我一樣的燈，穿著和我一樣的外套。他沒有回頭。',
  '守燈日誌・其五\n\n我數過地窖裡的外套，一共十一件，尺寸都一樣。\n每一件的口袋裡都有一本日誌。每一本的第一頁，都寫著「霧又上來了」。',
  '守燈日誌・其六\n\n下一個提燈下來的人，如果你讀到這裡：\n殺了牠沒有用。牠死的時候，燈會需要新的燈芯。\n你可以把燈熄掉。我沒有這個勇氣，所以你才會在這裡。'
];
const RELICS = [
  { id: 'anchor', n: '鏽蝕的船錨', d: '重攻擊傷害提高 50%' },
  { id: 'cloak', n: '守燈人的外套', d: '翻滾消耗的體力減少 40%' },
  { id: 'lung', n: '溺者之肺', d: '生命上限 +30，並立刻回復' },
  { id: 'eye', n: '第三隻眼', d: '任何理智下都看得見隱藏記號，但理智流失加快 50%' },
  { id: 'blood', n: '黑潮之血', d: '理智低於一半時，傷害提高 30%' },
  { id: 'oil', n: '鯨脂燈油', d: '燈油 +1，每次多回復 20 生命' },
  { id: 'bell', n: '靜默之鈴', d: '擊殺幻影得到的迴響變成三倍' },
  { id: 'salt', n: '鹽晶護符', d: '理智流失減少 40%' },
  { id: 'blade', n: '獵潮者之刃', d: '輕攻擊傷害提高 20%，每次擊殺回復 4 生命' },
  { id: 'shell', n: '迴響之殼', d: '得到的迴響增加 30%' }
];
const UPS = [
  { id: 'vit', n: '體魄', d: '生命上限 +15', max: 8, cost: l => 30 + l * 30 },
  { id: 'end', n: '耐力', d: '體力上限 +12', max: 6, cost: l => 30 + l * 30 },
  { id: 'blade', n: '磨刃', d: '傷害 +10%', max: 8, cost: l => 40 + l * 35 },
  { id: 'will', n: '意志', d: '理智上限 +15', max: 5, cost: l => 30 + l * 25 },
  { id: 'flask', n: '燈油瓶', d: '燈油 +1', max: 3, cost: l => 90 + l * 90 }
];

/* ---------- 輸入 ---------- */
const keys = {}, press = {};
let mouse = { x: W / 2, y: H / 2, used: false };
const MAP = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', KeyJ: 'light', KeyK: 'heavy', Space: 'roll', KeyQ: 'heal', KeyR: 'heal', KeyE: 'use', KeyF: 'use' };
addEventListener('keydown', e => {
  const k = MAP[e.code]; if (!k) return;
  if (state === 'play') e.preventDefault();
  if (!keys[k]) press[k] = true; keys[k] = true;
});
addEventListener('keyup', e => { const k = MAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const stage = $('#stage');
function toCanvas(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('mousemove', e => { const p = toCanvas(e); mouse.x = p.x; mouse.y = p.y; mouse.used = true; });
cv.addEventListener('mousedown', e => { if (state !== 'play') return; e.preventDefault(); const p = toCanvas(e); mouse.x = p.x; mouse.y = p.y; mouse.used = true; press[e.button === 2 ? 'heavy' : 'light'] = true; });
cv.addEventListener('contextmenu', e => e.preventDefault());

/* 觸控：左半邊拖曳是搖桿，右下是按鈕 */
const touch = { id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
const stick = $('#stick'), pad = $('#pad');
let isTouch = false;
function enableTouch() { if (isTouch) return; isTouch = true; pad.hidden = state !== 'play'; }
cv.addEventListener('touchstart', e => {
  enableTouch(); e.preventDefault(); mouse.used = false;
  for (const t of e.changedTouches) {
    if (touch.id === null) {
      const r = stage.getBoundingClientRect();
      touch.id = t.identifier; touch.ox = t.clientX; touch.oy = t.clientY; touch.dx = touch.dy = 0;
      stick.hidden = false; stick.style.left = (t.clientX - r.left - 48) + 'px'; stick.style.top = (t.clientY - r.top - 48) + 'px';
      stick.firstElementChild.style.transform = '';
    }
  }
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === touch.id) {
    let dx = t.clientX - touch.ox, dy = t.clientY - touch.oy; const m = Math.hypot(dx, dy) || 1, c = Math.min(m, 40);
    dx = dx / m * c; dy = dy / m * c; touch.dx = dx / 40; touch.dy = dy / 40;
    stick.firstElementChild.style.transform = `translate(${dx}px,${dy}px)`;
  }
}, { passive: false });
const endTouch = e => { for (const t of e.changedTouches) if (t.identifier === touch.id) { touch.id = null; touch.dx = touch.dy = 0; stick.hidden = true; } };
cv.addEventListener('touchend', endTouch); cv.addEventListener('touchcancel', endTouch);
pad.addEventListener('touchstart', e => { enableTouch(); const b = e.target.closest('button'); if (b) { e.preventDefault(); press[b.dataset.k] = true; } }, { passive: false });
pad.addEventListener('mousedown', e => { const b = e.target.closest('button'); if (b) press[b.dataset.k] = true; });

/* ---------- 遊戲狀態 ---------- */
let state = 'hub';           // hub | play | modal
let run = null, fl = null, P = null;
let cam = { x: 0, y: 0 }, shake = 0, time = 0;
let parts = [], texts = [];

function newRun() {
  const u = meta.up;
  run = { floor: 0, echoes: 0, relics: [], kills: 0 };
  P = {
    x: 0, y: 0, r: 11, hpMax: 100 + u.vit * 15, stMax: 100 + u.end * 12, saMax: 100 + u.will * 15,
    flaskMax: 2 + u.flask, dmg: 1 + u.blade * 0.1, facing: 0, st: 'idle', t: 0, act: null,
    inv: 0, stDelay: 0, flash: 0, healT: 0
  };
  P.hp = P.hpMax; P.sta = P.stMax; P.san = P.saMax; P.flask = P.flaskMax;
  meta.runs++; saveMeta();
  enterFloor(0);
}
const has = id => run.relics.includes(id);

/* ---------- 地圖生成 ---------- */
function genFloor(f) {
  const tiles = new Uint8Array(MW * MH);
  const F = { f, tiles, rooms: [], en: [], obj: [], bolts: [], haz: [], boss: null, puzzle: null, phT: 6, cleared: false };
  const carve = (x0, y0, x1, y1) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (x > 0 && y > 0 && x < MW - 1 && y < MH - 1) tiles[y * MW + x] = 1; };
  const mid = r => ({ x: (r.x + r.w / 2) * T, y: (r.y + r.h / 2) * T });
  const spot = (r, m = 1) => ({ x: (ri(r.x + m, r.x + r.w - 1 - m) + .5) * T, y: (ri(r.y + m, r.y + r.h - 1 - m) + .5) * T });

  if (f === 3) { // 頭目層：一個大空間
    const r = { x: 14, y: 9, w: 28, h: 22 }; carve(r.x, r.y, r.x + r.w - 1, r.y + r.h - 1); F.rooms.push(r);
    F.start = { x: (r.x + r.w / 2) * T, y: (r.y + r.h - 3) * T };
    F.boss = mkEnemy('boss', (r.x + r.w / 2) * T, (r.y + 7) * T, f); F.en.push(F.boss);
    return F;
  }
  let guard = 0;
  while (F.rooms.length < 8 && guard++ < 400) {
    const w = ri(7, 12), h = ri(6, 9), x = ri(2, MW - w - 2), y = ri(2, MH - h - 2);
    if (F.rooms.some(o => x < o.x + o.w + 2 && x + w + 2 > o.x && y < o.y + o.h + 2 && y + h + 2 > o.y)) continue;
    F.rooms.push({ x, y, w, h });
  }
  if (F.rooms.length < 7) return genFloor(f);
  F.rooms.sort((a, b) => a.x + a.y * .4 - b.x - b.y * .4);
  F.rooms.forEach(r => carve(r.x, r.y, r.x + r.w - 1, r.y + r.h - 1));
  const link = (a, b) => {
    const ax = Math.floor(a.x + a.w / 2), ay = Math.floor(a.y + a.h / 2), bx = Math.floor(b.x + b.w / 2), by = Math.floor(b.y + b.h / 2);
    if (Math.random() < .5) { carve(Math.min(ax, bx), ay, Math.max(ax, bx), ay + 1); carve(bx, Math.min(ay, by), bx + 1, Math.max(ay, by)); }
    else { carve(ax, Math.min(ay, by), ax + 1, Math.max(ay, by)); carve(Math.min(ax, bx), by, Math.max(ax, bx), by + 1); }
  };
  for (let i = 1; i < F.rooms.length; i++) link(F.rooms[i - 1], F.rooms[i]);
  link(F.rooms[0], F.rooms[ri(3, F.rooms.length - 1)]);

  const R = F.rooms, startR = R[0], exitR = R[R.length - 1];
  const others = shuffle(R.slice(1, -1));
  const vaultR = others[0], hintR = others[1], brazR = others[2], idolR = others[3];
  F.start = mid(startR);
  F.obj.push({ k: 'stairs', ...mid(exitR) });
  F.obj.push({ k: 'brazier', ...spot(brazR, 2), lit: false });
  F.obj.push({ k: 'idol', ...spot(idolR, 2), used: false });
  // 謎題：三根石柱要照順序觸碰，順序刻在另一個房間的地上，理智夠低才看得見
  const glyphs = shuffle([0, 1, 2, 3, 4, 5]).slice(0, 3);
  F.puzzle = { order: glyphs.slice(), idx: 0, solved: false };
  const vm = mid(vaultR), pos = shuffle(glyphs.slice());
  pos.forEach((gl, i) => F.obj.push({ k: 'pillar', x: vm.x + (i - 1) * 64, y: vm.y, gl, on: false }));
  const hm = mid(hintR); F.obj.push({ k: 'hint', x: hm.x, y: hm.y });
  if (meta.remnant && meta.remnant.floor === f) F.obj.push({ k: 'remnant', ...spot(pick(others.slice(1)), 1), amt: meta.remnant.amt });

  for (const r of R) {
    if (r === startR) continue;
    let n = ri(1, 2) + Math.floor(f * .8) + (r === exitR ? 1 : 0); if (r === vaultR) n = 1;
    for (let i = 0; i < n; i++) {
      const roll = Math.random(), s = spot(r);
      const type = roll < (f === 0 ? .7 : .5) ? 'drowned' : roll < (f === 0 ? .92 : .8) ? 'cultist' : 'tendril';
      F.en.push(mkEnemy(type, s.x, s.y, f));
    }
  }
  return F;
}
function mkEnemy(type, x, y, f) {
  const s = 1 + f * .28;
  const B = {
    drowned: { r: 12, hp: 58, spd: 74, dmg: 17, echo: 10 },

      for (let i = 0; i < 9; i++) { const b = i / 9 * TAU + Math.sin(time + i) * .2; g.beginPath(); g.moveTo(Math.cos(b) * 30, Math.sin(b) * 30); g.quadraticCurveTo(Math.cos(b + .4) * 66, Math.sin(b + .4) * 66, Math.cos(b + Math.sin(time * 1.5 + i) * .5) * 84, Math.sin(b + Math.sin(time * 1.5 + i) * .5) * 84); g.stroke(); }
      g.fillStyle = fx ? '#fff' : (e.hp < e.max * .5 ? '#3b2a55' : '#17403b'); g.beginPath(); g.arc(0, 0, e.r, 0, TAU); g.fill();

  for (const b of fl.bolts) { g.fillStyle = '#c9a7ff'; g.beginPath(); g.arc(b.x, b.y, 5, 0, TAU); g.fill(); g.fillStyle = 'rgba(145,99,214,.35)'; g.beginPath(); g.arc(b.x, b.y, 9, 0, TAU); g.fill(); }
  // 玩家
  if (P.hp > 0) {
    g.save(); g.translate(P.x, P.y);
    if (P.st === 'atk') { const A = P.act; if (A.ph === 1 || (A.ph === 2 && A.t > A.rec - .08)) { g.strokeStyle = A.heavy ? '#eaa53a' : '#e6e1cf'; g.lineWidth = A.heavy ? 7 : 4; g.globalAlpha = .85; g.beginPath(); g.arc(0, 0, A.range - 8, A.ang - A.arc / 2, A.ang + A.arc / 2); g.stroke(); g.globalAlpha = 1; } else if (A.ph === 0 && A.heavy) { g.strokeStyle = 'rgba(234,165,58,.4)'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, A.range - 8, A.ang - A.arc / 2, A.ang + A.arc / 2); g.stroke(); } }

/* ---------- 介面 ---------- */
const ov = $('#ov'), promptEl = $('#prompt'), toastEl = $('#toast');

function hub() {
  setState('hub');
  const u = meta.up;
  show(`<h2>霧港燈塔</h2>
    <p>燈熄了三天。鎮上的人一個接一個走進海裡。你是守燈人，地窖的門在你腳下。</p>
    ${meta.remnant ? `<p class="dim">你有 ${meta.remnant.amt} 迴響遺落在第 ${meta.remnant.floor + 1} 層。走到那一層可以撿回來。</p>` : ''}

ov.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;

const H_ = { hp: $('#fHp'), st: $('#fSt'), sa: $('#fSa'), tHp: $('#tHp'), tSt: $('#tSt'), tSa: $('#tSa'), fl: $('#tFl'), ec: $('#tEc') };
let hudKey = '';

  H_.tHp.textContent = hp; H_.tSt.textContent = st; H_.tSa.textContent = sa; H_.fl.textContent = P ? P.flask : 2 + meta.up.flask; H_.ec.textContent = run ? run.echoes : 0;
}

/* ---------- 主迴圈 ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now; time += dt;
  if (state === 'play') {
    updatePlayer(dt);
    if (state === 'play') { updateEnemies(dt); updateWorld(dt); }
    const pr = state === 'play' ? promptFor(nearObj()) : ''; promptEl.hidden = !pr; if (pr) promptEl.textContent = pr;

}
hub();
requestAnimationFrame(frame);
})();
